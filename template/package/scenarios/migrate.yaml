# migrate.yaml — workflow=migrate（原 migration+adapter 合并）
# fork-and-own：源资产复制进新仓、新仓拥有。二级 pattern 由
# new_project_patterns.py 判定（源有无 contract/）；复制名单/参考目录
# 全部以本文件为单一真源，new-project.sh 只消费不定义。
scenario_id: migrate
description: source_root ≠ repo_root;迁入老仓,fork-and-own 选择性移植
recognition:
  has_source_root: true
  same_dir_as_repo: false

# 源侧禁拷（full_copy 与 port_to_contract 共用;守住「选择性移植、禁 cp -r 整包」立场）
forbid:
  - data/
  - _runs/
  - saved/
  - references/
  - .git/
  - .venv/

patterns:
  full_copy:                        # 源有 contract/ → 整套照搬源代码,不套演示骨架
    when: "source_root 有 contract/ 目录"
    copy_targets:
      contract_glob: "contract/*.py"      # 含 __init__.py;排除 __pycache__
      workspace_dir: "workspace/"         # 整目录(排除 __pycache__)
      root_files: [train.py, experiment.py]  # 根级,存在则复制
  port_to_contract:                 # 源无 contract/ → 套模板骨架 + 老资产进只读参考区
    when: "source_root 无 contract/ 目录"
    legacy_dir: references/legacy/

port_targets:  # port_to_contract 专用:agent 手抄拆解指导
  prepare_data: "把老 train.py 数据加载逻辑搬到 contract/prepare_data.py"
  metrics:      "把老 evaluate/ 逻辑搬到 contract/metrics.py"
  test:         "把老 test/ 验证逻辑搬到 contract/test.py"
  learner:      "把老 model 定义搬到 workspace/build_learner 装饰的类"
  objective:    "把老 loss 定义搬到 workspace/build_objective 装饰的类"

freedom_levels:
  A:
    routine: "保留原 LR / EPOCHS / BATCH_SIZE(暂不改)"
    extend: "对齐骨架默认超参"
    novel: "AutoML 调优"
  B:
    routine: "保留原模型架构(优先保证复现)"
    extend: "小幅改 backbone"
    novel: "换架构(高风险,先确认 baseline 复现)"
  C:
    routine: "保留原 loss(优先保证复现)"
    extend: "加正则项"
    novel: "换 loss(高风险)"
  D:
    routine: "保留原数据增强"
    extend: "加 baseline 增强"
    novel: "自研增强"
  E:
    locked: true
decision_tree:
  - when: "首轮 primary 与源项目历史值差距 > 2pp"
    do:
      - "检查 contract/prepare_data 与源数据加载是否一致(seed / 划分 / 归一化)"
      - "检查 contract/metrics 与源 evaluate 口径是否一致(accuracy 公式/聚合方式)"
      - "读 _runs/results.tsv 详情与源 baseline 对比"
  - when: "primary 与源一致但后续轮未提升"
    do:
      - "进入常规 A 档调参流程(同 build)"
      - "记录原 baseline 作为 keeper 入池的强 baseline"
  - when: "出仓闭包检查报缺 import 目标文件"
    do:
      - "对照 .auto-nn/init-align.json 的 copy_targets,缺的文件补进 migrate.yaml 或手抄"
      - "重跑 check_copy_closure.py 确认 rc=0 再继续"
  - when: "源 vs 答卷差异表(.auto-nn/migration-diff.json)有条目"
    do:
      - "按 manual.md 适配与差异工作清单逐条核改落点文件"
      - "核改完成后 doctor 复核口径与答卷一致"
  - when: "无法定位 contract/ 边界(port_to_contract)"
    do:
      - "读模板仓 docs/maintainer/mirror-mechanism.md 确认 contract/workspace 分工"
      - "拆 prepare_data 优先(数据边界最清晰)"
      - "metrics 拆完再拆 test(E 档口径定下来)"
