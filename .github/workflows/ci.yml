name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml numpy
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        # Two invocations: both trees have files named test_nn_config.py etc.
        run: |
          python -m pytest tests -q -p no:cacheprovider
          python -m pytest template/package/scripts/tests -q -p no:cacheprovider

  lint:
    name: contract lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Package docs contract (PROTOCOL / CLAUDE)
        run: bash template/package/scripts/check_package_docs_contract.sh
      - name: Skill ↔ code contract
        run: bash template/package/scripts/check_skill_contract.sh --quiet
      - name: Skill installer dry-run
        run: ./install.sh --dry-run
